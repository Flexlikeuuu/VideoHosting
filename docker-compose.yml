services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-youtube}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-youtube_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-youtube}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - youtube_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - youtube_net

  minio:
    image: pgsty/silo:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_secret}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - youtube_net

  minio-init:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "false"
    command:
      - python
      - -c
      - |
        import asyncio
        from app.core.config import settings
        from app.core.storage import get_s3_client

        async def init_buckets():
            async with get_s3_client() as client:
                existing = {b["Name"] for b in (await client.list_buckets()).get("Buckets", [])}
                for bucket in (settings.MINIO_VIDEOS_BUCKET, settings.MINIO_THUMBNAILS_BUCKET):
                    if bucket not in existing:
                        await client.create_bucket(Bucket=bucket)
                        print(f"Created bucket: {bucket}")
                    else:
                        print(f"Bucket already exists: {bucket}")

        asyncio.run(init_buckets())
    restart: "no"
    networks:
      - youtube_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - youtube_net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "false"
    command: ["arq", "app.worker.WorkerSettings"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import glob; assert any('arq' in open(p, 'rb').read().decode('utf-8', 'ignore') for p in glob.glob('/proc/[0-9]*/cmdline'))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - youtube_net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/v1/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - youtube_net

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  youtube_net:
    driver: bridge
